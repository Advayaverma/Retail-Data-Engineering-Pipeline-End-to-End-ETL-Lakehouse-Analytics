version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: retail_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_secure_pass_2027}
      POSTGRES_DB: ${POSTGRES_DB:-retail_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail_admin} -d ${POSTGRES_DB:-retail_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail_etl_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PIPELINE_ENV=docker
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-retail_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-retail_secure_pass_2027}
      - POSTGRES_DB=${POSTGRES_DB:-retail_dw}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres_data:
