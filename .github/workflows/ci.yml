name: Lakehouse CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Undefined Symbol Checks (Flake8)
        run: |
          flake8 src tests scripts notebooks --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Code Style & Complexity Warnings
        run: |
          flake8 src tests scripts --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  test-suite:
    name: Unit & Integration Test Suite
    needs: code-quality-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up OpenJDK 17 (PySpark Engine)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Test Runner (70 Tests)
        run: |
          python tests/run_tests.py

  pipeline-e2e-dryrun:
    name: End-to-End Pipeline Execution
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Lakehouse Pipeline
        run: |
          python scripts/run_pipeline.py

      - name: Archive Pipeline Execution Summary
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-execution-summary
          path: docs/pipeline_execution_summary.md

  build-container:
    name: Docker Image Build & Validation
    needs: pipeline-e2e-dryrun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: retail-data-engineering:latest
